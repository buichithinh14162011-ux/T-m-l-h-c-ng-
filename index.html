<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An - Bạn đồng hành tâm lý học đường</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .chat-container { max-height: 70vh; overflow-y: auto; }
        .message { max-width: 85%; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-teal-50 min-h-screen">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-white shadow-2xl flex flex-col">
            <div class="p-6 border-b">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-teal-500 text-white rounded-3xl flex items-center justify-center text-3xl">🌱</div>
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-800">An</h1>
                        <p class="text-teal-600 text-sm">Bạn đồng hành tâm lý học đường</p>
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs uppercase tracking-widest text-gray-500 mb-4 px-3">Chủ đề hay gặp</h2>
                <div onclick="startTopic('ap-luc')" class="px-4 py-3 hover:bg-teal-50 rounded-3xl cursor-pointer flex items-center gap-3 text-gray-700 mb-1">📚 Áp lực học tập</div>
                <div onclick="startTopic('mat-tap-trung')" class="px-4 py-3 hover:bg-teal-50 rounded-3xl cursor-pointer flex items-center gap-3 text-gray-700 mb-1">😶 Mất tập trung</div>
                <div onclick="startTopic('ban-be')" class="px-4 py-3 hover:bg-teal-50 rounded-3xl cursor-pointer flex items-center gap-3 text-gray-700 mb-1">👥 Mâu thuẫn bạn bè</div>
                <div onclick="startTopic('can-thang')" class="px-4 py-3 hover:bg-teal-50 rounded-3xl cursor-pointer flex items-center gap-3 text-gray-700 mb-1">😟 Căng thẳng, lo âu</div>
                <div onclick="startTopic('tuong-lai')" class="px-4 py-3 hover:bg-teal-50 rounded-3xl cursor-pointer flex items-center gap-3 text-gray-700">🚀 Định hướng tương lai</div>
            </div>
            
            <div class="p-6 text-xs text-teal-600 border-t mt-auto">
                Mình là An nè.<br>
                Tụi mình cứ thoải mái tâm sự nhé ❤️
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col">
            <div class="bg-white px-6 py-4 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-teal-100 rounded-3xl flex items-center justify-center text-3xl">🌱</div>
                    <div>
                        <h2 class="font-semibold text-gray-800">An</h2>
                        <p class="text-green-500 text-sm flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>Đang lắng nghe</p>
                    </div>
                </div>
                <button onclick="clearChat()" class="flex items-center gap-2 text-gray-500 hover:text-red-500 text-sm">
                    <i class="fas fa-trash"></i>
                    <span>Xóa cuộc trò chuyện</span>
                </button>
            </div>

            <div id="chat-container" class="flex-1 p-6 bg-[radial-gradient(#f1f5f9_1px,transparent_1px)] [background-size:30px_30px] chat-container">
                <div id="messages" class="max-w-3xl mx-auto space-y-6"></div>
            </div>

            <div class="bg-white border-t p-4">
                <div class="max-w-3xl mx-auto">
                    <div class="flex bg-gray-100 rounded-3xl p-2">
                        <input id="user-input" type="text" 
                               placeholder="Hôm nay bạn muốn tâm sự gì với An nè?"
                               class="flex-1 bg-transparent px-6 outline-none text-gray-700 placeholder-gray-400 text-base"
                               onkeydown="if(event.key === 'Enter') sendMessage()">
                        <button onclick="sendMessage()" class="bg-teal-500 hover:bg-teal-600 w-12 h-12 rounded-3xl text-white flex items-center justify-center transition">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addMessage(text, isUser) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message`;
            
            if (isUser) {
                div.innerHTML = `<div class="bg-teal-500 text-white px-5 py-3.5 rounded-3xl rounded-tr-none">${text}</div>`;
            } else {
                div.innerHTML = `
                <div class="flex gap-3">
                    <div class="w-9 h-9 bg-teal-100 rounded-3xl flex-shrink-0 flex items-center justify-center text-3xl">🌱</div>
                    <div class="bg-white shadow px-5 py-3.5 rounded-3xl rounded-tl-none text-gray-700 whitespace-pre-wrap">${text}</div>
                </div>`;
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function getAIResponse(message) {
            const msg = message.toLowerCase();
            
            // Áp lực học tập
            if (msg.includes("áp lực") || msg.includes("thi") || msg.includes("điểm")) {
                return `Nghe bạn kể mà An thấy thương cái sự cố gắng của bạn xíu. Học hành mà cứ thấy nặng nề, mệt mỏi đúng không nè?<br><br>Có lẽ bạn đang rơi vào trạng thái “kiệt sức vô hình” rồi – não bộ quá tải nên càng nhồi càng khó chịu.<br><br>Thử mấy cách nhỏ này xem sao:<br>• Tắt hết thông báo điện thoại trong 30 phút<br>• Viết ra giấy chỉ 1 môn bạn đang lo nhất thôi<br>• Đi dạo hoặc hít thở sâu đúng 3 phút<br><br>Mà ngoài chuyện học ra, hôm nay có gì làm bạn vui một chút không?`;
            }
            
            // Mất tập trung
            if (msg.includes("tập trung") || msg.includes("chán") || msg.includes("mất tập trung")) {
                return `An hiểu rồi… Cảm giác ngồi học mà đầu óc cứ bay khắp nơi, khó chịu lắm nhỉ?<br><br>Thường là vì não đang quá tải hoặc bạn đang so sánh bản thân với người khác quá nhiều.<br><br>Thử mấy cách này nha:<br>• Bắt đầu bằng 5 phút thôi (Pomodoro mini)<br>• Để điện thoại xa tầm tay<br>• Nghe nhạc không lời nhẹ nhàng<br><br>Bạn đang khó tập trung nhất vào môn nào vậy?`;
            }
            
            // Mâu thuẫn bạn bè
            if (msg.includes("bạn") || msg.includes("cãi") || msg.includes("mâu thuẫn")) {
                return `Nghe bạn nói về chuyện bạn bè mà An cũng thấy xót xót. Mâu thuẫn nhỏ mà làm mình buồn cả ngày đúng không?<br><br>Có khi là do hai đứa đang hiểu lầm nhau, hoặc ai cũng đang có áp lực riêng.<br><br>Thử xem:<br>• Viết ra giấy những gì bạn đang cảm thấy<br>• Chọn lúc bình tĩnh để nói chuyện thật lòng<br>• Nhớ rằng không phải lúc nào cũng cần “đúng”<br><br>Bạn đang buồn nhất về chuyện gì với bạn ấy vậy?`;
            }
            
            // Căng thẳng, lo âu
            if (msg.includes("căng") || msg.includes("lo") || msg.includes("stress") || msg.includes("buồn")) {
                return `An đang lắng nghe đây… Căng thẳng và lo âu nó làm mình thấy mệt mỏi thật sự phải không?<br><br>Nhiều khi là vì mình đang cố gánh hết mọi thứ một mình.<br><br>Thử mấy điều nhỏ này nha:<br>• Hít thở 4-7-8 (hít 4, giữ 7, thở 8)<br>• Nói chuyện với một người mình tin tưởng<br>• Làm một việc mình thích dù chỉ 10 phút<br><br>Hôm nay bạn đang lo lắng nhiều nhất về điều gì nè?`;
            }
            
            // Định hướng tương lai
            if (msg.includes("tương lai") || msg.includes("nghề") || msg.includes("đại học")) {
                return `Chuyện tương lai đôi khi làm mình bối rối và lo lắng thật sự nhỉ?<br><br>Nhiều bạn đang sợ chọn sai đường, sợ không đủ giỏi…<br><br>Thử bắt đầu từ những thứ nhỏ này:<br>• Liệt kê 3 điều bạn thích làm<br>• Tìm hiểu 1 ngành/nghề bạn tò mò<br>• Nói chuyện với thầy cô hoặc anh chị khóa trên<br><br>Bạn đang lo lắng nhất về phần nào của tương lai vậy?`;
            }
            
            // Phản hồi mặc định
            return `An đang lắng nghe nè… Cảm ơn bạn đã tin tưởng chia sẻ.<br><br>Mình thấy bạn đang cố gắng rất nhiều, dù chỉ là nói ra cũng đã dũng cảm lắm rồi.<br><br>Thử mấy cách nhỏ này xem sao:<br>• Dành 5 phút để thở và không nghĩ gì cả<br>• Viết ra 1 điều bạn tự hào về bản thân hôm nay<br>• Nhắc nhở bản thân rằng bạn không cần hoàn hảo<br><br>Mà này, ngoài chuyện đó ra, hôm nay bạn có gì muốn kể thêm không?`;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            setTimeout(() => {
                const response = getAIResponse(text);
                addMessage(response, false);
            }, 700);
        }

        function startTopic(topic) {
            const messages = document.getElementById('messages');
            messages.innerHTML = '';
            
            let greeting = "Chào bạn! An ở đây nè. Kể mình nghe bạn đang cảm thấy thế nào hôm nay?";
            
            if (topic === 'ap-luc') greeting = "Áp lực học tập hả? An hiểu lắm… Kể An nghe bạn đang áp lực vì điều gì nè?";
            else if (topic === 'mat-tap-trung') greeting = "Mất tập trung đúng không? An cũng từng gặp. Bạn đang khó tập trung nhất vào cái gì?";
            else if (topic === 'ban-be') greeting = "Chuyện bạn bè làm bạn buồn à? Kể An nghe đi, mình cùng gỡ rối nha.";
            else if (topic === 'can-thang') greeting = "Căng thẳng và lo âu hả? An đang lắng nghe đây. Bạn đang cảm thấy thế nào?";
            else if (topic === 'tuong-lai') greeting = "Định hướng tương lai đôi khi làm mình bối rối lắm. Bạn đang nghĩ gì về nó?";
            
            addMessage(greeting, false);
        }

        function clearChat() {
            if (confirm("Bạn có muốn xóa cuộc trò chuyện không nè?")) {
                document.getElementById('messages').innerHTML = '';
                setTimeout(() => {
                    addMessage("Chào bạn! ❤️<br><br>Mình là An nè – người bạn đồng hành tâm lý học đường của bạn.<br><br>Tụi mình cứ thoải mái tâm sự nhé, An sẽ lắng nghe và cùng bạn gỡ những nút thắt trong lòng. Hôm nay bạn muốn kể gì?", false);
                }, 300);
            }
        }

        window.onload = () => {
            addMessage("Chào bạn! ❤️<br><br>Mình là An nè. Mình không phải máy trả lời kiến thức đâu, mình chỉ là người bạn luôn lắng nghe và thấu hiểu những gì bạn đang trải qua.<br><br>Hôm nay bạn đang cảm thấy thế nào? Áp lực học, buồn chuyện bạn bè, hay đang lo tương lai? Cứ kể An nghe thoải mái nha.", false);
        };
    </script>
</body>
</html>
