<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Tham vấn Tâm lý Học đường</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg-color: #f0f4f8;
            --chat-bg: #ffffff;
            --user-msg: #e3f2fd;
            --bot-msg: #f9f9f9;
            --text-main: #333;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* User Message Style */
        .user-msg {
            align-self: flex-end;
            background: var(--user-msg);
            color: #1565c0;
            padding: 12px 16px;
            border-radius: 18px 18px 0 18px;
            max-width: 75%;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Bot Message Style (Following Prompt's Markdown UI Requirement) */
        .bot-wrapper {
            align-self: flex-start;
            width: 100%;
            max-width: 90%;
            background: var(--bot-msg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .bot-status-bar {
            display: flex;
            justify-content: space-between;
            background: #fff;
            padding: 10px 15px;
            border-bottom: 2px solid var(--border);
            font-size: 0.9em;
            font-weight: bold;
            color: #555;
        }

        .bot-content {
            padding: 15px;
            border-left: 4px solid var(--primary);
            background: #fafafa;
            color: var(--text-main);
            line-height: 1.6;
        }

        .bot-content strong {
            color: var(--primary);
        }

        .bot-content p {
            margin: 8px 0 0 0;
            font-style: italic;
        }

        /* Status Colors */
        .status-stable { color: #2e7d32; } /* Ổn định - Xanh lá */
        .status-unstable { color: #f57c00; } /* Bất ổn - Cam */
        .status-emergency { color: #d32f2f; } /* Khẩn cấp - Đỏ */

        /* Input Area */
        .input-area {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid var(--border);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #ccc;
            border-radius: 24px;
            outline: none;
            font-size: 1em;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 12px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #357abd;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            🌱 Trợ Lý Tâm Lý Học Đường Ảo
        </div>
        
        <div class="chat-history" id="chat-history">
            <!-- Tin nhắn chào mừng mặc định -->
            <div class="bot-wrapper">
                <div class="bot-status-bar">
                    <span class="status-stable">🟩 TRẠNG THÁI: Ổn định</span>
                    <span>👤 ĐỐI TƯỢNG: Học sinh</span>
                </div>
                <div class="bot-content">
                    <strong>[LỜI KHUYÊN & CHIA SẺ TỪ TRỢ LÝ]</strong>
                    <p>Chào cậu, tớ ở đây rồi nè. Cứ coi tớ như một người bạn cạ cứng, một góc nhỏ bình yên để cậu có thể thoải mái xả hết những bực dọc, mệt mỏi hay áp lực dạo này nha. Hôm nay của cậu thế nào?</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Nhập tâm sự của bạn vào đây..." autocomplete="off">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');

        // Bắt sự kiện nhấn Enter
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. In tin nhắn của người dùng lên UI
            appendUserMessage(text);
            userInput.value = '';
            scrollToBottom();

            // 2. Giả lập AI suy nghĩ và phản hồi sau 1 giây
            setTimeout(() => {
                const response = generateBotResponse(text);
                appendBotMessage(response);
                scrollToBottom();
            }, 800);
        }

        function appendUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'user-msg';
            msgDiv.textContent = text;
            chatHistory.appendChild(msgDiv);
        }

        function appendBotMessage(data) {
            const wrapper = document.createElement('div');
            wrapper.className = 'bot-wrapper';
            
            wrapper.innerHTML = `
                <div class="bot-status-bar">
                    <span class="${data.statusClass}">${data.icon} TRẠNG THÁI: ${data.statusLabel}</span>
                    <span>👤 ĐỐI TƯỢNG: Học sinh</span>
                </div>
                <div class="bot-content">
                    <strong>[LỜI KHUYÊN & CHIA SẺ TỪ TRỢ LÝ]</strong>
                    <p>${data.message}</p>
                </div>
            `;
            chatHistory.appendChild(wrapper);
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // --- MÔ PHỎNG LOGIC AI THEO PROMPT YÊU CẦU ---
        function generateBotResponse(input) {
            const text = input.toLowerCase();
            
            // Chế độ khẩn cấp
            if (text.includes("muốn chết") || text.includes("tuyệt vọng") || text.includes("tự tử") || text.includes("kết thúc")) {
                return {
                    statusClass: "status-emergency",
                    icon: "🟥",
                    statusLabel: "Khẩn cấp",
                    message: "Cậu ơi, tớ đang nghe đây. Những suy nghĩ này cho thấy cậu đang phải chịu đựng một nỗi đau quá sức. Xin cậu, hãy dừng lại một nhịp thở. Cậu không đơn độc đâu! Khẩn thiết mong cậu hãy gọi ngay cho đường dây nóng bảo vệ trẻ em 111, gọi cho ba mẹ hoặc nhờ ai đó đưa đến trung tâm y tế gần nhất nhé. Sự an toàn của cậu lúc này là quan trọng nhất!"
                };
            }
            
            // Chế độ bất ổn (Thể chất / Tâm lý nặng)
            if (text.includes("đau đầu") || text.includes("mỏi vai") || text.includes("khó thở") || text.includes("stress quá") || text.includes("mệt mỏi")) {
                return {
                    statusClass: "status-unstable",
                    icon: "🟨",
                    statusLabel: "Bất ổn",
                    message: "Tớ thấy cậu đang có những dấu hiệu kiệt sức về thể chất rồi đó. Cậu có đang chạy deadline hay ép bản thân quá không? Ngay lúc này, hãy nhắm mắt lại, hít một hơi thật sâu vào bụng, rồi thở ra nhẹ nhàng. Thử đứng dậy đi dạo một vòng hoặc uống cốc nước ấm nhé. Nếu đau đầu kéo dài, cậu nhớ nói với người lớn để đi gặp bác sĩ kiểm tra nhen, tuyệt đối không tự uống thuốc linh tinh nha."
                };
            }

            // Chế độ ổn định (Tâm sự thông thường)
            return {
                statusClass: "status-stable",
                icon: "🟩",
                statusLabel: "Ổn định",
                message: "Tớ rất hiểu cảm giác của cậu lúc này. Ở độ tuổi tụi mình, việc cảm thấy mông lung hay áp lực chuyện bài vở, bạn bè là rất bình thường. Cậu đã làm rất tốt khi dám nói ra những điều này. Cậu muốn kể chi tiết hơn cho tớ nghe về chuyện đó không? Tớ vẫn ở đây."
            };
        }
    </script>
</body>
</html>
