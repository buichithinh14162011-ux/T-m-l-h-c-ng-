<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Bình Yên - Trợ Lý Tham Vấn Học Đường</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --panel-bg: #ffffff;
            --primary-color: #6c5ce7;
            --accent-color: #a29bfe;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --chat-bot: #f1f2f6;
            --chat-user: #6c5ce7;
            --emergency-color: #ff7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 90%;
            max-width: 650px;
            height: 85vh;
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .app-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .app-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .status-indicator {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 12px;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ecc71;
            transition: all 0.3s ease;
        }

        .status-indicator.emergency {
            background-color: var(--emergency-color);
            box-shadow: 0 0 15px var(--emergency-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #fafafa;
        }

        .msg-wrapper {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.55;
            white-space: pre-line;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .msg-wrapper.bot-style {
            background-color: var(--chat-bot);
            color: var(--text-main);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .msg-wrapper.user-style {
            background-color: var(--chat-user);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .test-box {
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .test-option {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .test-option:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .input-footer {
            padding: 15px 20px;
            background: #ffffff;
            border-top: 1px solid #eeeeee;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-footer textarea {
            flex: 1;
            height: 42px;
            max-height: 100px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-footer textarea:focus {
            border-color: var(--primary-color);
        }

        .input-footer button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .input-footer button:hover {
            background: #5b4cc4;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1 id="botTitle">Góc Bình Yên</h1>
        <p>Mình luôn ở đây lắng nghe câu chuyện của bạn</p>
        <div class="status-indicator" id="statusIndicator"></div>
    </div>
    
    <div class="chat-body" id="chatArea">
        <!-- Tin nhắn đối thoại tự động kết nối liền mạch tại đây -->
    </div>

    <div class="input-footer">
        <textarea id="textInput" placeholder="Trút bỏ gánh nặng tại đây nhé..." rows="1"></textarea>
        <button id="sendBtn" onclick="processUserInteraction()">➔</button>
    </div>
</div>

<script>
    // Bộ nhớ hội thoại (Trí nhớ ngữ cảnh liền mạch)
    const conversationState = {
        hasWelcomed: false,
        mentionedSymptoms: [],
        testActive: false,
        isEmergency: false
    };

    const chatArea = document.getElementById('chatArea');
    const textInput = document.getElementById('textInput');
    const statusIndicator = document.getElementById('statusIndicator');

    // Luật cốt lõi và kịch bản phân loại phản hồi
    function generateDynamicReply(input) {
        const cleanInput = input.toLowerCase().trim();
        let replyText = "";

        // BƯỚC 4: KIỂM TRA CHẾ ĐỘ KHẨN CẤP (Ý định tự hại, quá tiêu cực)
        if (cleanInput.includes("chết") || cleanInput.includes("tự tử") || cleanInput.includes("rạch tay") || cleanInput.includes("muốn biến mất") || cleanInput.includes("buông xuôi")) {
            conversationState.isEmergency = true;
            statusIndicator.classList.add('emergency');
            
            return {
                text: `Mình đang giữ không gian này hoàn toàn an toàn cho bạn, xin bạn hãy ở lại đây nói chuyện với mình thêm một chút nhé, đừng đi đâu một mình lúc này nha. Mình biết mọi thứ bên trong bạn đang vụn vỡ và cực kỳ nặng nề, chịu đựng một mình thật sự rất bất công với bạn.\n\nBây giờ, ưu tiên hàng đầu là an toàn của bạn. Hãy ôm lấy bản thân một cái thật chặt, sau đó nhấc máy lên gọi hoặc nhắn tin ngay cho cha mẹ, một người thân trong nhà, hoặc thầy cô nào bạn tin tưởng nhất được không? Nếu cảm thấy quá nghẹt thở, hãy gọi ngay tổng đài quốc gia 111 hoặc đến trung tâm y tế gần nhất nha. Hãy để mọi người có cơ hội được dang tay bảo vệ và chia sẻ bớt gánh nặng này cùng bạn. Bạn cực kỳ quan trọng, nhớ nhé!`,
                hasTest: false
            };
        }

        // Ghi nhận triệu chứng vật lý từ tin nhắn của học sinh (Nếu có)
        if (cleanInput.includes("đau đầu") || cleanInput.includes("mệt") || cleanInput.includes("mỏi vai") || cleanInput.includes("suy nhược")) {
            conversationState.mentionedSymptoms.push("thể chất");
        }
        if (cleanInput.includes("khó thở") || cleanInput.includes("hồi hộp") || cleanInput.includes("tim đập nhanh")) {
            conversationState.mentionedSymptoms.push("tim mạch/hít thở");
        }

        // BƯỚC 3: SÀNG LỌC TRIỆU CHỨNG BẰNG BÀI TEST NHỎ (Nếu có dấu hiệu suy nhược cơ thể/não bộ)
        if (conversationState.mentionedSymptoms.length > 0 && !conversationState.testActive) {
            conversationState.testActive = true;
            replyText = `Mình nghe bạn kể nãy giờ và cảm nhận được cơ thể bạn đang phát đi tín hiệu 'SOS' rồi đó. Để tụi mình hiểu rõ hơn hiện trạng bộ não và cơ thể bạn đang gánh chịu, tụi mình làm nhanh một bài test nhỏ xíu này nha:\n\nBạn cảm thấy dấu hiệu nào dưới đây giống mình nhất lúc này?`;
            return { text: replyText, hasTest: true, testType: "physical" };
        }

        // BƯỚC 2: ĐÁNH GIÁ & ĐƯA RA GIẢI PHÁP TÍCH CỰC / GIẢI TỎA VẬT LÝ
        if (cleanInput.includes("áp lực") || cleanInput.includes("lo âu") || cleanInput.includes("stress") || cleanInput.includes("thi cử") || cleanInput.includes("rớt")) {
            let memoryLink = conversationState.mentionedSymptoms.length > 0 ? "Vừa mệt mỏi rã rời trong người mà tâm trí còn phải " : "Mình hiểu cảm giác nghẹt thở này, ";
            
            replyText = `Ỏ, ${memoryLink}gánh gồng hàng tá áp lực thi cử, học hành đúng là khiến tụi mình dễ rơi vào trạng thái 'overload' thực sự. Việc bạn muốn đạt kết quả tốt là rất đáng trân trọng, nhưng đừng ép bản thân phải hoàn hảo đến mức vắt kiệt năng lượng nhé. \n\nBây giờ việc cần làm ngay là tụi mình tạm 'pause' bài vở lại tầm 10 phút đã. Bạn hãy uống một ngụm nước ấm thật chậm, bật một bài nhạc không lời thanh bình lên, hoặc đi dạo vài vòng quanh phòng đi nè. Phải cho bộ não nghỉ ngơi một chút thì tư duy tích cực mới quay trở lại được, đừng cố quá sức nha cậu!`;
            return { text: replyText, hasTest: false };
        }

        // Phản hồi dựa trên lựa chọn bài test thể chất từ học sinh
        if (cleanInput.includes("[test-physical-1]")) {
            conversationState.testActive = false;
            return {
                text: `Cảm ơn bạn đã phản hồi nha. Đau đầu dữ dội kèm chóng mặt liên tục thế này khả năng cao là biểu hiện của bệnh lý thể chất cơ học hoặc suy nhược tuần hoàn rồi á. \n\nĐối với dấu hiệu rõ rệt này, mình khuyên bạn nên sắp xếp đi gặp bác sĩ chuyên khoa tại bệnh viện hoặc phòng khám gần nhất để được kiểm tra trực quan và kê đơn chuẩn xác nha (tụi mình tuyệt đối không được tự ý mua thuốc uống đâu nè). Đừng chủ quan với sức khỏe của mình nha!`,
                hasTest: false
            };
        }
        if (cleanInput.includes("[test-physical-2]")) {
            conversationState.testActive = false;
            return {
                text: `Mình hiểu rồi, tình trạng khó thở và hồi hộp này phần lớn xuất phát từ tâm lý căng thẳng (psychological stress) đẩy nhịp tim lên cao đó. \n\nTụi mình cùng xử lý vật lý ngay lập tức nè: Bạn ngồi thẳng lưng lên, thả lỏng hai vai ra. Hít vào thật sâu bằng mũi trong vòng 4 giây... giữ hơi lại 3 giây... rồi từ từ thở sạch ra bằng miệng trong 5 giây. Làm đi làm lại chu kỳ này 3-5 lần là hệ thần kinh sẽ tự động dịu lại ngay. Bạn thử liền xem có đỡ hơn chút nào không nha!`,
                hasTest: false
            };
        }

        // BƯỚC 1: TIẾP NHẬN & ĐIỀU PHỐI BẦU KHÔNG KHÍ (Mở đầu / Phản hồi chung)
        if (!conversationState.hasWelcomed) {
            conversationState.hasWelcomed = true;
            replyText = `Chào bạn nè! Mình rất vui vì bạn đã chủ động ghé vào góc nhỏ này. Nơi đây hoàn toàn kín đáo và không có bất kỳ sự phán xét nào đâu. Hôm nay của bạn thế nào, đang có chuyện gì khiến bạn thấy nặng lòng hay ngột ngạt không? Cứ thoải mái chia sẻ, tụi mình cùng gỡ rối như hai người bạn thân nha!`;
        } else {
            replyText = `Mình vẫn đang lắng nghe từng lời bạn chia sẻ đây, cuộc trò chuyện của tụi mình vẫn tiếp tục nè. Bạn cứ thoải mái nói ra hết những suy nghĩ trong lòng đi, việc nói ra được đã là một cách giúp tâm can nhẹ nhõm hơn một nửa rồi á.`;
        }
        
        return { text: replyText, hasTest: false };
    }

    // Hàm xuất tin nhắn lên giao diện người dùng
    function pushMessage(content, origin) {
        const bubble = document.createElement('div');
        bubble.classList.add('msg-wrapper', origin === 'bot' ? 'bot-style' : 'user-style');
        bubble.innerText = content;
        chatArea.appendChild(bubble);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Hàm tạo khối câu hỏi trắc nghiệm / Bài test sàng lọc triệu chứng
    function injectInteractiveTest(type) {
        const testContainer = document.createElement('div');
        testContainer.classList.add('test-box');

        if (type === "physical") {
            testContainer.innerHTML = `
                <button class="test-option" onclick="handleTestSelection('Đau đầu dữ dội, chóng mặt hoặc mỏi vai gáy cơ học', '[test-physical-1]')">1. Đau đầu dữ dội, chóng mặt hoặc mỏi vai gáy cơ học</button>
                <button class="test-option" onclick="handleTestSelection('Khó thở, tức ngực, tim đập nhanh khi nghĩ về áp lực', '[test-physical-2]')">2. Khó thở, tức ngực, tim đập nhanh khi nghĩ về áp lực</button>
            `;
        }
        chatArea.appendChild(testContainer);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Xử lý khi học sinh click chọn đáp án trong bài test
    function handleTestSelection(visibleText, internalCode) {
        pushMessage(visibleText, 'user');
        
        // Tạo hiệu ứng chờ phản hồi tự nhiên mặt-đối-mặt
        setTimeout(() => {
            const evaluation = generateDynamicReply(internalCode);
            pushMessage(evaluation.text, 'bot');
        }, 500);
    }

    // Xử lý luồng tương tác khi người dùng gõ văn bản gửi đi
    function processUserInteraction() {
        const rawText = textInput.value.trim();
        if (rawText === "") return;

        pushMessage(rawText, 'user');
        textInput.value = "";
        textInput.style.height = "42px";

        setTimeout(() => {
            const responseData = generateDynamicReply(rawText);
            pushMessage(responseData.text, 'bot');
            
            if (responseData.hasTest) {
                injectInteractiveTest(responseData.testType);
            }
        }, 600);
    }

    // Hỗ trợ tự động mở rộng độ cao khung gõ chữ khi nhập văn bản dài
    textInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // Gửi tin nhắn mượt mà bằng phím Enter
    textInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            processUserInteraction();
        }
    });

    // Tự động khởi chạy kích hoạt luồng chào đón ở lượt chat đầu tiên
    window.onload = () => {
        const welcomeSegment = generateDynamicReply("");
        pushMessage(welcomeSegment.text, 'bot');
    };
</script>

</body>
</html>
