<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạn Đồng Hành - Tâm Lý Học Đường</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .chat-container { max-height: 70vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-teal-50 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-white shadow-xl flex flex-col">
            <div class="p-6 border-b">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-teal-500 rounded-2xl flex items-center justify-center text-white text-3xl">🌱</div>
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-800">Bạn Đồng Hành</h1>
                        <p class="text-teal-600 text-sm">Tâm lý học đường</p>
                    </div>
                </div>
            </div>
            
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs uppercase font-medium text-gray-500 mb-3 px-3">Chủ đề phổ biến</h2>
                <div onclick="startTopic('ap-luc')" class="px-4 py-3 hover:bg-teal-50 rounded-2xl cursor-pointer flex items-center gap-3 text-gray-700 mb-2">
                    <span class="text-xl">📚</span>
                    <span>Áp lực học tập & thi cử</span>
                </div>
                <div onclick="startTopic('ban-be')" class="px-4 py-3 hover:bg-teal-50 rounded-2xl cursor-pointer flex items-center gap-3 text-gray-700 mb-2">
                    <span class="text-xl">👥</span>
                    <span>Mâu thuẫn với bạn bè</span>
                </div>
                <div onclick="startTopic('dong-luc')" class="px-4 py-3 hover:bg-teal-50 rounded-2xl cursor-pointer flex items-center gap-3 text-gray-700 mb-2">
                    <span class="text-xl">🔥</span>
                    <span>Thiếu động lực học tập</span>
                </div>
                <div onclick="startTopic('can-thang')" class="px-4 py-3 hover:bg-teal-50 rounded-2xl cursor-pointer flex items-center gap-3 text-gray-700 mb-2">
                    <span class="text-xl">😟</span>
                    <span>Căng thẳng, lo âu</span>
                </div>
                <div onclick="startTopic('tuong-lai')" class="px-4 py-3 hover:bg-teal-50 rounded-2xl cursor-pointer flex items-center gap-3 text-gray-700">
                    <span class="text-xl">🚀</span>
                    <span>Định hướng tương lai</span>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col">
            <div class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-teal-100 rounded-2xl flex items-center justify-center text-2xl">🌱</div>
                    <div>
                        <h2 class="font-medium">Bạn Đồng Hành</h2>
                        <p class="text-xs text-green-500">● Đang online</p>
                    </div>
                </div>
                <button onclick="clearChat()" class="text-gray-500 hover:text-teal-600 flex items-center gap-2 text-sm">
                    <i class="fas fa-trash"></i>
                    <span>Xóa cuộc trò chuyện</span>
                </button>
            </div>

            <div id="chat-container" class="flex-1 p-6 bg-[radial-gradient(#f1f5f9_1px,transparent_1px)] [background-size:30px_30px] chat-container">
                <div id="messages" class="max-w-3xl mx-auto space-y-6"></div>
            </div>

            <div class="bg-white border-t p-4">
                <div class="max-w-3xl mx-auto flex gap-3 bg-gray-100 rounded-3xl px-6 py-2">
                    <input id="user-input" type="text" 
                           placeholder="Chia sẻ với mình điều gì đang diễn ra nhé..."
                           class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-400"
                           onkeydown="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="w-10 h-10 bg-teal-500 hover:bg-teal-600 rounded-2xl text-white flex items-center justify-center">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addMessage(text, isUser) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            
            if (isUser) {
                div.innerHTML = `<div class="bg-teal-500 text-white px-5 py-3 rounded-3xl rounded-tr-none max-w-[80%]">${text}</div>`;
            } else {
                div.innerHTML = `
                <div class="flex gap-3">
                    <div class="w-8 h-8 bg-teal-100 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0">🌱</div>
                    <div class="bg-white shadow px-5 py-3 rounded-3xl rounded-tl-none text-gray-800 max-w-[80%]">${text}</div>
                </div>`;
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function getAIResponse(msg) {
            const text = msg.toLowerCase();
            if (text.includes("áp lực") || text.includes("thi")) return "Mình hiểu bạn đang rất áp lực với việc học. Bạn đang lo về điểm số hay kỳ thi sắp tới? Kể mình nghe chi tiết hơn nhé. Nhớ là bạn không cần gánh một mình, hãy chia sẻ với thầy cô hoặc gia đình nha ❤️";
            if (text.includes("bạn") || text.includes("cãi")) return "Có vẻ bạn đang gặp mâu thuẫn với bạn bè. Đây là chuyện bình thường. Bạn có muốn kể cụ thể hơn không? Mình sẽ lắng nghe và cùng bạn nghĩ cách giải quyết.";
            if (text.includes("động lực") || text.includes("chán")) return "Thiếu động lực là điều nhiều bạn gặp phải. Bạn đang cảm thấy mệt mỏi vì cái gì? Chúng ta có thể bắt đầu từ những việc nhỏ để lấy lại năng lượng nhé.";
            if (text.includes("căng") || text.includes("lo") || text.includes("stress")) return "Mình đang lắng nghe đây. Bạn đang căng thẳng và lo âu phải không? Cảm giác này rất bình thường. Nếu kéo dài, bạn nên nói với người thân hoặc thầy cô. Bạn không cô đơn đâu ❤️";
            return "Cảm ơn bạn đã tin tưởng chia sẻ. Mình đang lắng nghe và thấu hiểu những gì bạn đang trải qua. Bạn có thể kể thêm chi tiết không? Nhớ nhé, bạn không cần phải tự mình gánh vác mọi thứ – hãy tìm đến bạn bè, gia đình, thầy cô khi cần.";
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, true);
            input.value = '';
            setTimeout(() => {
                addMessage(getAIResponse(text), false);
            }, 700);
        }

        function startTopic(topic) {
            document.getElementById('messages').innerHTML = '';
            let msg = "Chào bạn! Mình rất vui khi bạn muốn nói về chủ đề này.";
            if (topic === 'ap-luc') msg = "Áp lực học tập là vấn đề rất phổ biến. Bạn đang cảm thấy áp lực như thế nào? Mình ở đây để lắng nghe ❤️";
            if (topic === 'ban-be') msg = "Bạn đang gặp khó khăn với bạn bè à? Kể mình nghe đi, mình sẽ cùng bạn suy nghĩ cách giải quyết.";
            if (topic === 'dong-luc') msg = "Thiếu động lực là chuyện bình thường. Bạn đang cảm thấy chán học vì lý do gì? Chúng ta cùng tìm lại động lực nhé!";
            if (topic === 'can-thang') msg = "Căng thẳng và lo âu là cảm xúc thật. Bạn đang lo lắng điều gì? Mình lắng nghe và khuyên bạn nên chia sẻ với người thân nếu cần.";
            if (topic === 'tuong-lai') msg = "Định hướng tương lai đôi khi khiến ta bối rối. Bạn đang nghĩ gì về tương lai của mình? Mình ở đây để cùng bạn suy nghĩ tích cực.";
            addMessage(msg, false);
        }

        function clearChat() {
            if (confirm("Xóa toàn bộ cuộc trò chuyện?")) {
                document.getElementById('messages').innerHTML = '';
                addMessage("Chào bạn! ❤️<br><br>Mình là <strong>Bạn Đồng Hành</strong> – AI chuyên lắng nghe tâm sự học đường.<br><br>Hôm nay bạn muốn chia sẻ gì nào?", false);
            }
        }

        // Khởi động
        window.onload = () => {
            addMessage("Chào bạn! ❤️<br><br>Mình là <strong>Bạn Đồng Hành</strong>, luôn ở đây để lắng nghe và đồng hành cùng bạn về mọi vấn đề tâm lý học đường.<br><br>Bạn đang cảm thấy thế nào hôm nay? Kể mình nghe nhé!", false);
        };
    </script>
</body>
</html>
